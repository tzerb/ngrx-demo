<div class="app-container" [class.dark-mode]="darkMode$ | async">
  <header>
    <div class="header-content">
      <h1>{{ title() }} - NgRx State Management Demo</h1>
      <button class="dark-mode-toggle" (click)="toggleDarkMode()">
        @if (darkMode$ | async) {
          ☀️ Light Mode
        } @else {
          🌙 Dark Mode
        }
      </button>
    </div>
  </header>

  <main>
    <div class="demo-section full-width">
      <app-counter></app-counter>
    </div>

    <div class="split-section">
      <div class="demo-section left-panel">
        <app-user-list></app-user-list>
      </div>

      <div class="demo-section right-panel">
        <app-user-summary></app-user-summary>
      </div>
    </div>
  </main>

  <footer>
    <p>Open Redux DevTools to inspect the state</p>
  </footer>
</div>

<router-outlet />
